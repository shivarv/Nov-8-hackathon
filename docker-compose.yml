services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grocer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grocer}
      POSTGRES_DB: ${POSTGRES_DB:-grocer}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grocer} -d ${POSTGRES_DB:-grocer}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-grocer}:${POSTGRES_PASSWORD:-grocer}@db:5432/${POSTGRES_DB:-grocer}
      CORS_ORIGINS: '["http://localhost:5173"]'
      SEED_ORDERS: ${SEED_ORDERS:-3000}
      # Instacart dataset (used automatically when archive/ is present; see data/README.md)
      DATA_SOURCE: ${DATA_SOURCE:-auto}
      INSTACART_DIR: /instacart
      PRICES_CSV: /data/product_prices.csv
      PRODUCT_IMAGES_CSV: /data/product_images.csv
      AISLE_IMAGES_CSV: /data/aisle_images.csv
      DEMO_SHOPPERS_JSON: /data/demo_shoppers.json
      INSTACART_ORDERS: ${INSTACART_ORDERS:-20000}
      # BehaviorGPT; leave empty to use the bought-together model only
      UNBOXAI_API_KEY: ${UNBOXAI_API_KEY:-}
      UNBOXAI_CATALOG_ID: ${UNBOXAI_CATALOG_ID:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./archive:/instacart:ro
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
