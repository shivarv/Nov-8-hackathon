services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grocer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grocer}
      POSTGRES_DB: ${POSTGRES_DB:-grocer}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grocer} -d ${POSTGRES_DB:-grocer}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-grocer}:${POSTGRES_PASSWORD:-grocer}@db:5432/${POSTGRES_DB:-grocer}
      CORS_ORIGINS: '["http://localhost:5173"]'
      SEED_SOURCE: ${SEED_SOURCE:-instacart}
      SEED_ORDERS: ${SEED_ORDERS:-0}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
